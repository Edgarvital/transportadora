version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: transportadora_db
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: adminpassword
      POSTGRES_DB: TransportadoraDB
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build:
      context: ./backend/src 
      dockerfile: Dockerfile
    container_name: transportadora_api
    restart: on-failure
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Host=db;Port=5432;Database=TransportadoraDB;Username=admin;Password=adminpassword
      - Cors__AllowedOrigin=http://localhost:3000 
    ports:
      - "8080:8080"
    depends_on:
      - db

  frontend:
    build:
      context: ./frontend 
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=http://localhost:8080/api
    container_name: transportadora_frontend
    restart: on-failure
    ports:
      - "3000:80" 
    depends_on:
      - api

volumes:
  postgres_data: